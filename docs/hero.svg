<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title description">
  <title id="title">UrbanGrid Planner</title>
  <desc id="description">A precise city grid connects terrain, zoning rules, and build strategy decisions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A17"/>
      <stop offset="0.55" stop-color="#0B2B25"/>
      <stop offset="1" stop-color="#123B35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76E0B5"/>
      <stop offset="1" stop-color="#D9F27C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00110E" flood-opacity="0.45"/>
    </filter>
    <pattern id="micro-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#76E0B5" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1440" height="640" rx="34" fill="url(#background)"/>
  <rect width="1440" height="640" rx="34" fill="url(#micro-grid)"/>
  <circle cx="1170" cy="115" r="240" fill="#53C6A0" opacity="0.055"/>
  <circle cx="270" cy="570" r="260" fill="#D9F27C" opacity="0.04"/>

  <g transform="translate(78 72)">
    <rect x="0" y="0" width="168" height="36" rx="18" fill="#173F38" stroke="#32665B"/>
    <circle cx="20" cy="18" r="5" fill="#D9F27C"/>
    <text x="34" y="23" fill="#CDE9DF" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700" letter-spacing="1.2">JAVA 21 · LOCAL</text>

    <text x="0" y="112" fill="#F5FBF8" font-family="Inter, ui-sans-serif, system-ui" font-size="64" font-weight="760">UrbanGrid</text>
    <text x="0" y="174" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui" font-size="64" font-weight="760">Planner</text>
    <text x="2" y="226" fill="#A9C7BD" font-family="Inter, ui-sans-serif, system-ui" font-size="21">Terrain-aware planning with explicit policy boundaries.</text>

    <g transform="translate(0 290)">
      <rect width="330" height="132" rx="20" fill="#0D251F" stroke="#28544B"/>
      <text x="24" y="30" fill="#76E0B5" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="700" letter-spacing="1.4">MODEL</text>
      <text x="24" y="62" fill="#F5FBF8" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700">Strategy × Decorator</text>
      <text x="24" y="91" fill="#9AB8AE" font-family="Inter, ui-sans-serif, system-ui" font-size="14">Interchangeable city algorithms.</text>
      <text x="24" y="113" fill="#9AB8AE" font-family="Inter, ui-sans-serif, system-ui" font-size="14">Composable zoning decisions.</text>
    </g>

    <g transform="translate(0 440)">
      <text x="0" y="0" fill="#7D9E93" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="700" letter-spacing="1.2">PARSE</text>
      <path d="M62 -5H112" stroke="#50776B" stroke-width="2"/>
      <circle cx="120" cy="-5" r="4" fill="#76E0B5"/>
      <text x="138" y="0" fill="#7D9E93" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="700" letter-spacing="1.2">EVALUATE</text>
      <path d="M226 -5H276" stroke="#50776B" stroke-width="2"/>
      <circle cx="284" cy="-5" r="4" fill="#D9F27C"/>
      <text x="302" y="0" fill="#7D9E93" font-family="Inter, ui-sans-serif, system-ui" font-size="13" font-weight="700" letter-spacing="1.2">SIMULATE</text>
    </g>
  </g>

  <g transform="translate(670 82)" filter="url(#shadow)">
    <rect width="690" height="476" rx="28" fill="#F5F8F4"/>
    <rect x="28" y="24" width="634" height="50" rx="16" fill="#E6EEE9"/>
    <circle cx="54" cy="49" r="7" fill="#FF765F"/>
    <circle cx="78" cy="49" r="7" fill="#F2C95C"/>
    <circle cx="102" cy="49" r="7" fill="#67C99E"/>
    <text x="136" y="55" fill="#315047" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">sample-grid.txt · 3 × 4</text>

    <g transform="translate(38 100)">
      <g fill="#E4F2E9" stroke="#BDD1C5" stroke-width="1.5">
        <rect x="0" y="0" width="188" height="76" rx="14"/>
        <rect x="203" y="0" width="188" height="76" rx="14"/>
        <rect x="406" y="0" width="188" height="76" rx="14"/>
        <rect x="0" y="91" width="188" height="76" rx="14"/>
        <rect x="203" y="91" width="188" height="76" rx="14"/>
        <rect x="406" y="91" width="188" height="76" rx="14"/>
        <rect x="0" y="182" width="188" height="76" rx="14"/>
        <rect x="203" y="182" width="188" height="76" rx="14"/>
        <rect x="406" y="182" width="188" height="76" rx="14"/>
        <rect x="0" y="273" width="188" height="76" rx="14"/>
        <rect x="203" y="273" width="188" height="76" rx="14"/>
        <rect x="406" y="273" width="188" height="76" rx="14"/>
      </g>
      <g fill="#FFF1D5" stroke="#E6C77E" stroke-width="1.5">
        <rect x="203" y="0" width="188" height="76" rx="14"/>
        <rect x="406" y="91" width="188" height="76" rx="14"/>
        <rect x="406" y="182" width="188" height="76" rx="14"/>
      </g>
      <rect x="0" y="273" width="188" height="76" rx="14" fill="#E8E5E2" stroke="#B9B0AA" stroke-width="1.5"/>

      <g font-family="Inter, ui-sans-serif, system-ui">
        <g fill="#183C32" font-size="15" font-weight="750">
          <text x="16" y="28">FLAT</text><text x="219" y="28">SWAMPY</text><text x="422" y="28">FLAT</text>
          <text x="16" y="119">FLAT</text><text x="219" y="119">FLAT</text><text x="422" y="119">SWAMPY</text>
          <text x="16" y="210">FLAT</text><text x="219" y="210">FLAT</text><text x="422" y="210">SWAMPY</text>
          <text x="16" y="301">ROCKY</text><text x="219" y="301">FLAT</text><text x="422" y="301">FLAT</text>
        </g>
        <g fill="#527268" font-size="12" font-weight="650">
          <text x="16" y="54">F50</text><text x="219" y="54">F44 · HW</text><text x="422" y="54">HW</text>
          <text x="219" y="145">HW · C</text><text x="422" y="145">F42 · HW</text>
          <text x="219" y="236">HS</text><text x="422" y="236">HW · F35 · L24</text>
          <text x="16" y="327">HB</text><text x="219" y="327">HS</text><text x="422" y="327">L22</text>
        </g>
      </g>
    </g>
  </g>
</svg>
