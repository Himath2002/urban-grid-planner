<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">UrbanGrid Planner</title>
  <desc id="description">Terrain-aware city planning in Java 21.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A17"/>
      <stop offset="1" stop-color="#123B35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76E0B5"/>
      <stop offset="1" stop-color="#D9F27C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#00110E" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1090" cy="60" r="250" fill="#76E0B5" opacity="0.06"/>
  <circle cx="160" cy="650" r="290" fill="#D9F27C" opacity="0.05"/>

  <g transform="translate(78 92)" font-family="Inter, ui-sans-serif, system-ui">
    <rect width="158" height="36" rx="18" fill="#173F38" stroke="#32665B"/>
    <circle cx="20" cy="18" r="5" fill="#D9F27C"/>
    <text x="34" y="23" fill="#CDE9DF" font-size="14" font-weight="700" letter-spacing="1.1">JAVA 21 · LOCAL</text>
    <text x="0" y="126" fill="#F5FBF8" font-size="60" font-weight="780">UrbanGrid</text>
    <text x="0" y="186" fill="url(#accent)" font-size="60" font-weight="780">Planner</text>
    <text x="2" y="235" fill="#A9C7BD" font-size="20">Terrain-aware planning.</text>
    <text x="2" y="268" fill="#A9C7BD" font-size="20">Composable policy. Explicit boundaries.</text>

    <g transform="translate(0 335)">
      <rect width="364" height="118" rx="20" fill="#0D251F" stroke="#28544B"/>
      <text x="24" y="34" fill="#76E0B5" font-size="12" font-weight="750" letter-spacing="1.4">ENGINEERING MODEL</text>
      <text x="24" y="69" fill="#F5FBF8" font-size="19" font-weight="740">Strategy × Decorator</text>
      <text x="24" y="96" fill="#91B2A6" font-size="14">Parse → evaluate → simulate</text>
    </g>
  </g>

  <g transform="translate(566 90)" filter="url(#shadow)">
    <rect width="636" height="460" rx="28" fill="#F4F8F5"/>
    <rect x="30" y="26" width="576" height="50" rx="16" fill="#E5EEE9"/>
    <circle cx="56" cy="51" r="7" fill="#FF765F"/>
    <circle cx="80" cy="51" r="7" fill="#F2C95C"/>
    <circle cx="104" cy="51" r="7" fill="#67C99E"/>
    <text x="136" y="57" fill="#315047" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">CITY GRID · 3 × 4</text>

    <g transform="translate(30 104)" font-family="Inter, ui-sans-serif, system-ui">
      <g fill="#E5F2EA" stroke="#B9D0C4">
        <rect width="178" height="70" rx="13"/><rect x="199" width="178" height="70" rx="13"/><rect x="398" width="178" height="70" rx="13"/>
        <rect y="85" width="178" height="70" rx="13"/><rect x="199" y="85" width="178" height="70" rx="13"/><rect x="398" y="85" width="178" height="70" rx="13"/>
        <rect y="170" width="178" height="70" rx="13"/><rect x="199" y="170" width="178" height="70" rx="13"/><rect x="398" y="170" width="178" height="70" rx="13"/>
        <rect y="255" width="178" height="70" rx="13"/><rect x="199" y="255" width="178" height="70" rx="13"/><rect x="398" y="255" width="178" height="70" rx="13"/>
      </g>
      <g fill="#FFF1D4" stroke="#E4C679">
        <rect x="199" width="178" height="70" rx="13"/>
        <rect x="398" y="85" width="178" height="70" rx="13"/>
        <rect x="398" y="170" width="178" height="70" rx="13"/>
      </g>
      <rect y="255" width="178" height="70" rx="13" fill="#E7E4E1" stroke="#B7AFAA"/>
      <g fill="#183C32" font-size="13" font-weight="760">
        <text x="14" y="27">FLAT</text><text x="213" y="27">SWAMPY</text><text x="412" y="27">FLAT</text>
        <text x="14" y="112">FLAT</text><text x="213" y="112">FLAT</text><text x="412" y="112">SWAMPY</text>
        <text x="14" y="197">FLAT</text><text x="213" y="197">FLAT</text><text x="412" y="197">SWAMPY</text>
        <text x="14" y="282">ROCKY</text><text x="213" y="282">FLAT</text><text x="412" y="282">FLAT</text>
      </g>
      <g fill="#55766B" font-size="11" font-weight="650">
        <text x="14" y="51">F50</text><text x="213" y="51">F44 · HW</text><text x="412" y="51">HW</text>
        <text x="213" y="136">HW · C</text><text x="412" y="136">F42 · HW</text>
        <text x="213" y="221">HS</text><text x="412" y="221">HW · F35 · L24</text>
        <text x="14" y="306">HB</text><text x="213" y="306">HS</text><text x="412" y="306">L22</text>
      </g>
